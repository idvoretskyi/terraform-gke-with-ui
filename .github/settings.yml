# Repository settings — managed by https://github.com/apps/settings

repository:
  name: terraform-gke-with-ui
  description: Terraform modules for a production-ready GKE cluster with optional Prometheus and Grafana monitoring stack
  homepage: https://github.com/idvoretskyi/terraform-gke-with-ui
  topics:
    - gke
    - google-cloud
    - kubernetes
    - terraform
    - prometheus
    - grafana
    - monitoring
    - infrastructure-as-code
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
